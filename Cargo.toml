[package]
name = "naga-macros"
version = "0.3.1"
edition = "2024"
description = "Linux side-button bindings, onboard profiles, and software macros for Razer Naga V2 Pro"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
evdev = "0.13.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[profile.release]
lto = true
strip = true
